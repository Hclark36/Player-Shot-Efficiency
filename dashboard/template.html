<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA Player Analytics</title>
<style>
[hidden]{display:none!important}:root{font-family:system-ui,sans-serif;color:#172c32;background:#f3f5f6;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#102d36;color:#fff;padding:38px max(24px,calc((100vw - 1200px)/2))}header small{color:#7ed6bd;text-transform:uppercase;letter-spacing:.15em}h1{font-size:clamp(28px,4vw,44px);margin:10px 0}header p{max-width:750px;color:#c6d7dc}main{max-width:1250px;margin:auto;padding:24px}.controls{display:flex;gap:18px;align-items:end;flex-wrap:wrap}.control{display:grid;gap:7px;flex:1;min-width:210px}label{font-weight:650;font-size:14px}input,select,button{font:inherit;padding:12px;border:1px solid #a8bec5;border-radius:8px;background:white;color:#172c32}button{cursor:pointer;background:#006f60;color:white;border:0}.status{font-size:14px;color:#4d656e;margin:12px 0 22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e0e6e8;border-radius:12px;padding:20px}.card span{font-size:13px;color:#4d656e}.card strong{display:block;font-size:28px;margin:8px 0}.card small{font-size:12px;color:#526973}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px}p{line-height:1.6}.panel p,.notes{font-size:14px;color:#4d656e}.chart{width:100%;height:auto;display:block}table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}td,th{padding:11px 8px;text-align:right;border-bottom:1px solid #e4eaec}th:first-child,td:first-child{text-align:left}th{color:#526973;font-size:12px}.scroll{overflow:auto}.legend{font-size:13px;color:#526973}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 15px}.positive{color:#007a64}.negative{color:#b54a38}details{margin:22px 0;background:#e8eef0;padding:18px;border-radius:10px}summary{cursor:pointer;font-weight:650}a{color:#006f60}footer{font-size:12px;color:#526973;padding:18px 0}svg text{font-family:system-ui,sans-serif;fill:#526973;font-size:11px}.empty{padding:50px;text-align:center}button:focus,input:focus,select:focus{outline:3px solid #3cae97;outline-offset:2px}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:450px){main{padding:14px}.card{padding:14px}.card strong{font-size:23px}}
</style></head><body>
<header><small>Hunter Clark · NBA analytics</small><h1 id="title"></h1><p id="subtitle"></p></header>
<main><div class="controls"><div class="control"><label for="search">Search player name</label><input id="search" type="search" placeholder="Type any part of a name…" autocomplete="off"></div><div class="control"><label for="player">Player</label><select id="player"></select></div><div class="control" id="season-control"><label for="season">Season</label><select id="season"></select></div><button id="download" type="button">Download player CSV</button></div>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="view"></div>
<details><summary>Methods, data coverage, and interpretation</summary><div id="methods" class="notes"></div></details><footer id="footer"></footer></main>
<script id="data" type="application/octet-stream">__DASHBOARD_DATA__</script>
<script>
'use strict';
(async()=>{
const packed=Uint8Array.from(atob(document.getElementById('data').textContent.trim()),c=>c.charCodeAt(0));
const json=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
const D=JSON.parse(json),$=id=>document.getElementById(id); window.dashboardData=D;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const array=x=>Array.isArray(x)?x:(x==null?[]:[x]);D.players=array(D.players);D.players.forEach(p=>{p.seasons=array(p.seasons);p.history=array(p.history);p.seasons.forEach(s=>{s.zones=array(s.zones);s.shots=array(s.shots)})});
const fmt=(x,n=2)=>Number.isFinite(+x)?(+x).toFixed(n):'—',signed=x=>(x>0?'+':'')+fmt(x),year=y=>`${y-1}–${String(y).slice(-2)}`;
let current=D.players.find(p=>p.id===D.default)||D.players[0];let season='';
$('title').textContent=D.title;document.title=D.title+' | Hunter Clark';
$('subtitle').textContent=D.kind==='shot'?'Explore shot locations, scoring efficiency, and performance against a league benchmark across three seasons.':'Explore next-season scoring forecasts, historical performance, and the uncertainty around each projection.';
$('season-control').hidden=D.kind!=='shot';
$('footer').textContent=`Built ${D.built} · ${D.players.length} players · Precomputed results; no server required. Source notebook MD5: ${D.source_sha}`;
$('methods').innerHTML=D.kind==='shot'?`<p>Source data: NBA_Shots_04_25 (2023–24 and 2024–25) and cdechoch/nba-data-archive (2025–26 regular season). Coverage reflects the downloaded source snapshots. Free throws are excluded. Attempts under 40 feet and outside the Backcourt zone are retained.</p><p>A separate logistic regression benchmark is fitted for each player, excluding that player's training shots. Models train on the season ending ${esc(D.training_year)} and use court zone plus a four-degree-of-freedom natural spline for distance. Grouped binomial sufficient statistics retain the original per-shot likelihood. Expected points equal predicted make probability times shot value. This is a location benchmark, not an overall player-value measure or causal estimate.</p><p>All retained shots appear on the chart; locations are rounded to two decimals. Zone FG% intervals are 95% Wilson intervals, conditional on the observed attempts. They do not include league-model uncertainty. Defender pressure, role, and shot-clock context are not modeled. Players without a season are not shown for that season. ${array(D.skipped).length} player profiles could not be modeled.</p>`:`<p>Regular-season player totals come from sportsdataverse-data, with history from 2009–10 through 2025–26. Players need at least ${esc(D.minimum_attempts)} attempts in the season before the forecast. Missing names indicate source coverage or this eligibility rule, not a zero forecast.</p><p>The original notebook trains on outcome seasons through 2022–23, validates on 2023–24 and 2024–25, and tests on 2025–26. Elastic net is tuned by validation MAE and then refitted on all historical eligible season pairs for these forecasts. Predictors include shooting rates, age, volume, minutes, and per-game box-score statistics. Forecasts are conditional on next-season participation and attempts.</p><p>The approximate interval adds 2.5th and 97.5th percentile held-out model residuals to each prediction and clips to 0–3 points per attempt. It summarizes historical errors; individual 95% coverage is not guaranteed. Player development here means field-goal scoring efficiency, not overall value. Free throws are excluded from the outcome.</p>`;
function options(){const q=$('search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const list=D.players.filter(p=>p.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('player').innerHTML=list.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');if(!list.length){$('view').innerHTML='<div class="panel empty">No matching eligible players. Try another name.</div>';$('status').textContent='No matching players';$('download').disabled=true;return}current=list.find(p=>p.id===current?.id)||list[0];$('player').value=current.id;$('download').disabled=false;setSeasons();}
function setSeasons(){if(D.kind==='shot'){const years=current.seasons.map(s=>s.season);if(!years.includes(season))season=years[years.length-1];$('season').innerHTML=years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');$('season').value=season}render()}
function card(label,value,detail,cls=''){return `<div class="card"><span>${label}</span><strong class="${cls}">${value}</strong><small>${detail}</small></div>`}
function svg(body,w=620,h=330){return `<svg class="chart" role="img" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`}
function lineChart(points,forecast){const w=620,h=330,l=60,r=25,t=28,b=65;const values=points.map(p=>p.actual*100);if(forecast)values.push(forecast.prediction*100,forecast.lower*100,forecast.upper*100);else points.forEach(p=>values.push(p.expected*100));let lo=Math.min(...values)-5,hi=Math.max(...values)+5;const x=i=>l+(w-l-r)*i/Math.max(1,points.length-(forecast?0:1)),y=v=>h-b-(v-lo)/(hi-lo)*(h-t-b);let out='';for(let i=0;i<5;i++){const v=lo+(hi-lo)*i/4;out+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="#e3eaed"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,0)}</text>`}const path=(key,color,dash)=>`<polyline points="${points.map((p,i)=>`${x(i)},${y(p[key]*100)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" ${dash?'stroke-dasharray="6 4"':''}/>`;out+=path('actual','#007a70',false);if(!forecast)out+=path('expected','#c36a30',true);points.forEach((p,i)=>{out+=`<circle cx="${x(i)}" cy="${y(p.actual*100)}" r="4" fill="#007a70"><title>${esc(p.season||year(p.year))}: ${fmt(p.actual*100)} points per 100 attempts</title></circle>`;if(!forecast)out+=`<circle cx="${x(i)}" cy="${y(p.expected*100)}" r="4" fill="#c36a30"/>`;if(points.length<10||i%3===0)out+=`<text x="${x(i)}" y="${h-b+20}" text-anchor="middle">${esc(p.season||year(p.year))}</text>`});if(forecast){const i=points.length,xx=x(i),yy=y(forecast.prediction*100),low=y(forecast.lower*100),high=y(forecast.upper*100);out+=`<line x1="${x(i-1)}" y1="${y(points[i-1].actual*100)}" x2="${xx}" y2="${yy}" stroke="#c36a30" stroke-dasharray="5 4"/><line x1="${xx}" x2="${xx}" y1="${low}" y2="${high}" stroke="#c36a30" stroke-width="3"/><path d="M ${xx-7} ${low} H ${xx+7} M ${xx-7} ${high} H ${xx+7}" stroke="#c36a30"/><circle cx="${xx}" cy="${yy}" r="6" fill="#c36a30"/><text x="${xx}" y="${h-b+20}" text-anchor="middle">${year(D.forecast_year)}</text>`}out+=`<text x="${w/2}" y="${h-12}" text-anchor="middle">Points from field goals per 100 attempts</text>`;return svg(out)}
function court(s){const sx=x=>310+x*10,sy=y=>510-y*10;let o=`<rect x="60" y="40" width="500" height="470" fill="#fafcfc" stroke="#aebfc4"/><rect x="230" y="320" width="160" height="190" fill="none" stroke="#aebfc4"/><circle cx="310" cy="320" r="60" fill="none" stroke="#aebfc4"/><circle cx="310" cy="457.5" r="7.5" fill="none" stroke="#82999f"/><path d="M 280 470 H 340 M 90 510 V 368 M 530 510 V 368 M 90 368 A 237.5 237.5 0 0 1 530 368" fill="none" stroke="#aebfc4"/>`;s.shots.forEach(pt=>{o+=`<circle cx="${sx(pt[0])}" cy="${sy(pt[1])}" r="2.4" fill="${pt[2]===1?'#008979':'#ce653e'}" opacity=".5"><title>${pt[2]===1?'Made':'Missed'} · (${pt[0]}, ${pt[1]}) feet</title></circle>`});return svg(o,620,535)}
function zoneChart(s){const max=Math.max(1,...s.zones.map(z=>z.share));let o='';s.zones.forEach((z,i)=>{const yy=20+i*38;o+=`<text x="185" y="${yy+16}" text-anchor="end">${esc(z.name)}</text><rect x="195" y="${yy}" width="${z.share/max*330}" height="23" rx="3" fill="#008979"/><text x="${202+z.share/max*330}" y="${yy+16}">${fmt(z.share,1)}%</text>`});return svg(o,620,Math.max(100,s.zones.length*38+20))}
function render(){const p=current;$('status').textContent=`${p.name} · ${$('player').options.length} matching players of ${D.players.length} available`;if(D.kind==='shot'){const s=p.seasons.find(s=>s.season===season);$('view').innerHTML=`<div class="cards">${card('Field-goal attempts',s.attempts,esc(season))}${card('Actual points / attempt',fmt(s.actual,3),'Field goals only')}${card('Expected points / attempt',fmt(s.expected,3),'Player excluded from league model')}${card('Points above expected / 100',signed(s.above),'Relative to zone + distance benchmark',s.above>=0?'positive':'negative')}</div><div class="grid"><section class="panel"><h2>${esc(p.name)} · ${esc(season)} shot locations</h2><p class="legend"><span class="dot" style="background:#008979"></span>Made <span class="dot" style="background:#ce653e"></span>Missed · ${s.attempts} attempts</p>${court(s)}</section><section class="panel"><h2>Scoring efficiency across seasons</h2><p class="legend">Green: actual · Orange dashed: expected</p>${lineChart(p.seasons)}<h2>Shot distribution · ${esc(season)}</h2>${zoneChart(s)}</section></div><section class="panel"><h2>Zone breakdown</h2><div class="scroll"><table><thead><tr><th>Zone</th><th>Attempts</th><th>Share</th><th>FG%</th><th>95% FG% interval</th><th>Actual PPA</th><th>Expected PPA</th><th>Above expected / 100</th></tr></thead><tbody>${s.zones.map(z=>`<tr><td>${esc(z.name)}</td><td>${z.attempts}</td><td>${fmt(z.share,1)}%</td><td>${fmt(z.fg,1)}%</td><td>${fmt(z.lower,1)}–${fmt(z.upper,1)}%</td><td>${fmt(z.actual,3)}</td><td>${fmt(z.expected,3)}</td><td>${signed(z.above)}</td></tr>`).join('')}</tbody></table></div></section>`}else{$('view').innerHTML=`<div class="cards">${card('Forecast · '+year(D.forecast_year),fmt(p.prediction,3),'Points per field-goal attempt')}${card('Previous season',fmt(p.previous,3),p.attempts+' attempts')}${card('Predicted change / 100',signed(p.change),'Points per 100 attempts',p.change>=0?'positive':'negative')}${card('Approximate 95% interval',fmt(p.lower,2)+'–'+fmt(p.upper,2),'Historical-error interval; points / attempt')}</div><div class="grid"><section class="panel"><h2>${esc(p.name)} · history and forecast</h2><p class="legend">Green: observed · Orange: forecast and approximate interval</p>${lineChart(p.history,p)}</section><section class="panel"><h2>How accurate was the model?</h2><p>Held-out 2025–26 player results. Lower errors are better. Values below are points per 100 field-goal attempts.</p><table><thead><tr><th>Model</th><th>MAE</th><th>RMSE</th><th>Bias</th></tr></thead><tbody>${array(D.metrics).map(m=>`<tr><td>${esc(m.model)}</td><td>${fmt(100*m.mae)}</td><td>${fmt(100*m.rmse)}</td><td>${signed(100*m.bias)}</td></tr>`).join('')}</tbody></table><p>Elastic net minus baseline MAE: ${signed(array(D.bootstrap)[0].observed_difference)}; 95% paired bootstrap interval ${fmt(array(D.bootstrap)[0].lower_95)} to ${fmt(array(D.bootstrap)[0].upper_95)}. Negative differences favor elastic net.</p><p>A small forecast change should be interpreted alongside the model's historical errors and the player's interval.</p></section></div><section class="panel"><h2>Historical efficiency</h2><div class="scroll"><table><thead><tr><th>Season</th><th>Attempts</th><th>Points / attempt</th><th>Points / 100 attempts</th></tr></thead><tbody>${p.history.map(h=>`<tr><td>${year(h.year)}</td><td>${h.attempts}</td><td>${fmt(h.actual,3)}</td><td>${fmt(h.actual*100)}</td></tr>`).join('')}</tbody></table></div></section>`}}
$('search').addEventListener('input',options);$('player').addEventListener('change',()=>{current=D.players.find(p=>p.id===$('player').value);setSeasons()});$('season').addEventListener('change',()=>{season=$('season').value;render()});
$('download').addEventListener('click',()=>{const p=current;const rows=D.kind==='shot'?[['player','season','zone','attempts','fg_pct','actual_ppa','expected_ppa','points_above_expected_per_100'],...p.seasons.flatMap(s=>s.zones.map(z=>[p.name,s.season,z.name,z.attempts,z.fg,z.actual,z.expected,z.above]))]:[['player','forecast_season','prior_attempts','prior_ppa','forecast_ppa','lower_approx_95','upper_approx_95','change_per_100'],[p.name,year(D.forecast_year),p.attempts,p.previous,p.prediction,p.lower,p.upper,p.change]];const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`player_${p.id}_${D.kind}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});options();
})().catch(error=>{document.getElementById('status').textContent='Unable to load dashboard: '+error.message+'. Use a current version of Chrome, Safari, Edge, or Firefox.';console.error(error)});
</script></body></html>
